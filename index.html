<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitFam Pathways</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<img src="my-photo.jpg" id="cornerLogo" alt="FitFam host photo">
<div id="app"></div>
<audio id="endingMusic" src="ending-music.mp3" preload="auto"></audio>
<script>
const PIN1 = "1886";
const PIN2 = "2828";
const PIN3 = "3698";
const PIN4 = "4680";
const paths = {"pursuing-dreams": {"title": "Pursuing Dreams", "phase2_title": "Phase 2 — The Choice & Early Progress", "phase2_story": "You chose something uncertain.\n\nSomething not everyone understands.\n\nVoices around you say:\n\n“Be realistic.”\n“Be safe.”\n“Choose something stable.”\n\nEven at home…\n\nthere is doubt.\n\nBut you kept going.\n\nAnd things started to work.\n\nYou improved.\nYou progressed.\n\nYou started winning.\n\nFor a moment…\n\nit feels like you were right.", "phase3_title": "Phase 3 — The Wall", "phase3_story": "Then everything slows.\n\nYou hit a ceiling.\n\nNo matter what you do…\n\nnothing moves.\n\nYou begin to question:\n\n“Was everyone right?”\n“Should I stop?”", "phase4_title": "Phase 4 — The Call", "phase4_story": "You almost gave up.\n\nThen—\n\nyou call home.\n\nAnd instead of doubt…\n\nyou hear:\n\n“Don’t give up.”\n\n“Not just because it’s hard…”\n\n“But because you chose this.”", "phase5_title": "Phase 5 — Breakthrough", "phase5_story": "So you kept going.\n\nThrough doubt.\nThrough setbacks.\n\nAnd eventually—\n\nyou break through.\n\nNot just success.\n\nGrowth.\n\nThis path was never about talent.\n\nIt was about choosing not to give up."}, "quiet-impact": {"title": "Quiet Impact", "phase2_title": "Phase 2 — Small Actions", "phase2_story": "You are not loud.\n\nYou don’t seek attention.\n\nBut you notice things.\n\nYou help.\n\nSmall things.\n\nCarrying something for someone.\nPicking something up that was lost.\nHelping someone get where they need to go.\n\nIt feels…\n\nsmall.", "phase3_title": "Phase 3 — The First Act", "phase3_story": "You see something happen.\n\nSomeone drops something.\n\nWithout thinking—\n\nyou run to return it.\n\nNo hesitation.\n\nJust action.", "phase4_title": "Phase 4 — Another Act", "phase4_story": "Another moment.\n\nAnother situation.\n\nSomeone needs help.\n\nYou step in again.\n\nNo recognition.\n\nNo reward.\n\nJust helping.", "phase5_title": "Phase 5 — What You Never Saw", "phase5_story": "But what you didn’t see…\n\nwas everything that came after.\n\nHelping someone get home earlier—\n\nmeans more time with their child.\n\nHelping a family—\n\nmeans more time together.\n\nHelping someone find their lost phone—\n\nmeans saving memories.\n\nPhotos.\nVideos.\nMoments that can never be replaced.\n\nHelping a child—\n\ncan give them support.\n\nStructure.\n\nTime with loved ones who may not have much time left.\n\nWhat seemed small…\n\nwas never small.\n\nNot all impact is seen.\n\nBut it always reaches further than you think."}, "comeback": {"title": "The Comeback", "phase2_title": "Phase 2 — The Fall & The Load", "phase2_story": "At one point…\n\nthings were working.\n\nThen something changed.\n\nA setback.\nA failure.\n\nAnd suddenly—\n\nmore was placed on you.\n\nResponsibility.\nExpectations.\n\nWeight you didn’t ask for.\n\nYou keep going.\n\nBecause you have to.\n\nPeople depend on you.\n\nEven when you feel tired.\n\nEven when you feel behind.", "phase3_title": "Phase 3 — The Breaking Point", "phase3_story": "You slow down.\n\nYou question everything.\n\n“Can I really carry this?”\n\n“I’m already struggling…”\n\n“And now this?”", "phase4_title": "Phase 4 — The Decision", "phase4_story": "You have a choice.\n\nStay here.\n\nOr move forward—\n\nwith everything you carry.\n\nYou choose…\n\nto move.", "phase5_title": "Phase 5 — The Return", "phase5_story": "You don’t come back the same.\n\nYou come back stronger.\n\nBecause of what you carried.\n\nBecause of what you went through.\n\nBecause you didn’t stop.\n\nWhat almost broke you…\n\nbecame what built you."}, "second-chance": {"title": "Second Chance", "phase2_title": "Phase 2 — The Loss & The Low Point", "phase2_story": "It mattered.\n\nA lot.\n\nAnd now…\n\nit’s gone.\n\nYou don’t feel like moving.\n\nYou don’t feel like trying.\n\nBut still—\n\nyou show up.\n\nYou work out.\n\nDay after day.\n\nThrough discomfort.\n\nThrough heaviness.\n\nNot because it’s easy.\n\nBut because you keep going.", "phase3_title": "Phase 3 — The Slow Shift", "phase3_story": "Nothing changes overnight.\n\nBut something small shifts.\n\nA little more energy.\n\nA little more clarity.", "phase4_title": "Phase 4 — The Second Chance", "phase4_story": "Not something big.\n\nJust…\n\na moment where you realise—\n\nyou can move forward again.", "phase5_title": "Phase 5 — Rebuild", "phase5_story": "You begin again.\n\nNot the same.\n\nBut stronger in a different way.\n\nBecause you didn’t stop—\n\neven when it was hard.\n\nA second life begins with a small decision.\n\nAnd it grows through consistency—\n\nshowing up,\n\neven when you feel at your lowest."}, "missing-connection": {"title": "Missing Connection", "phase2_title": "Phase 2 — Close & Almost", "phase2_story": "You’ve both been here.\n\nSame place.\n\nSame sessions.\n\nSame workouts.\n\nBut never really connected.\n\nYou notice each other.\n\nSometimes.\n\nSmall moments.\n\nBut nothing happens.\n\nJust… passing by.", "phase3_title": "Phase 3 — Awareness", "phase3_story": "You begin to notice more.\n\nFamiliar faces.\n\nFamiliar presence.\n\nSomething feels close.\n\nBut not quite there.", "phase4_title": "Phase 4 — The Fitness Moment", "phase4_story": "Then one session—\n\nduring a workout—\n\nsomething changes.\n\nYou move at the same pace.\n\nSame rhythm.\n\nSame energy.\n\nYou push through the same effort.\n\nAnd in that moment—\n\nit clicks.", "phase5_title": "Phase 5 — Connection", "phase5_story": "From that moment…\n\neverything changes.\n\nIt’s no longer just workouts.\n\nIt’s shared moments.\n\nShared effort.\n\nA connection built over time.\n\nNot sudden.\n\nBut real.\n\nSome connections are not instant.\n\nThey are built—\n\nmoment by moment."}};
let selectedPathKey = null;
let selectedPath = null;
let finalMusicStarted = false;

function cleanInput(value) {
  return String(value || '').replace(/[^0-9a-zA-Z]/g, '').toLowerCase();
}

function show(html) {
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0, 0);
}

function wrongPin() { alert('ACCESS DENIED'); }

function locationImages(locationLetter) {
  return `
    <div class="locationBox">
      <h3>Location ${locationLetter}</h3>
      <p class="note">Use the map and photo below to find the correct location. Stay together. No one gets left behind.</p>
      <p class="mediaTitle">Map</p>
      <img class="locationImage" src="${selectedPathKey}-location-${locationLetter.toLowerCase()}-map.jpg" alt="Location ${locationLetter} map">
      <p class="mediaTitle">Location Photo</p>
      <img class="locationImage" src="${selectedPathKey}-location-${locationLetter.toLowerCase()}-photo.jpg" alt="Location ${locationLetter} photo">
    </div>
  `;
}

function screenStart() {
  show(`
    <section class="card intro">
      <h1>FitFam Pathways</h1>
      <h2>Choose Your Path</h2>
      <p class="story">Today begins with movement.

Run 1 full lap as a team.

Stay together.
No shortcuts.
No one gets left behind.

When your team returns to the starting point, enter PIN 1 to choose your path.</p>
      <button type="button" onclick="screenPin1()">START LAP</button>
    </section>
  `);
}

function screenPin1() {
  show(`
    <section class="card">
      <h1>Lap Complete</h1>
      <p class="story">Return to the starting point.

Enter PIN 1 to unlock your path choices.</p>
      <form onsubmit="return checkPin1(event)">
        <input id="pin1" type="tel" inputmode="numeric" placeholder="PIN 1" autocomplete="off">
        <button type="submit">UNLOCK PATHWAYS</button>
      </form>
    </section>
  `);
}

function checkPin1(event) {
  event.preventDefault();
  if (cleanInput(document.getElementById('pin1').value) === PIN1) screenChoosePath();
  else wrongPin();
  return false;
}

function screenChoosePath() {
  show(`
    <section class="card">
      <h1>Choose Your Path</h1>
      <p class="story">Every person follows a different path.

Today…

you will experience one.</p>
      <div class="pathGrid">
        ${Object.keys(paths).map(key => `<button type="button" onclick="selectPath('${key}')">${paths[key].title}</button>`).join('')}
      </div>
    </section>
  `);
}

function selectPath(key) {
  selectedPathKey = key;
  selectedPath = paths[key];
  screenPhase2();
}

function screenPhase2() {
  show(`
    <section class="card">
      <h1>${selectedPath.title}</h1>
      <h2>${selectedPath.phase2_title}</h2>
      <p class="story">${selectedPath.phase2_story}</p>
      ${locationImages('A')}
      <div class="exercise">Exercise: Jumping Lunges x 50</div>
      <p class="note">Complete the exercise at Location A, then return to the starting point for PIN 2.</p>
      <form onsubmit="return checkPin2(event)">
        <input id="pin2" type="tel" inputmode="numeric" placeholder="PIN 2" autocomplete="off">
        <button type="submit">UNLOCK PHASE 3</button>
      </form>
    </section>
  `);
}

function checkPin2(event) {
  event.preventDefault();
  if (cleanInput(document.getElementById('pin2').value) === PIN2) screenPhase3();
  else wrongPin();
  return false;
}

function screenPhase3() {
  show(`
    <section class="card">
      <h1>${selectedPath.title}</h1>
      <h2>${selectedPath.phase3_title}</h2>
      <p class="story">${selectedPath.phase3_story}</p>
      ${locationImages('B')}
      <div class="exercise">Exercise: Burpees x 20</div>
      <p class="note">Complete the exercise at Location B, then return to the starting point for PIN 3.</p>
      <form onsubmit="return checkPin3(event)">
        <input id="pin3" type="tel" inputmode="numeric" placeholder="PIN 3" autocomplete="off">
        <button type="submit">UNLOCK PHASE 4</button>
      </form>
    </section>
  `);
}

function checkPin3(event) {
  event.preventDefault();
  if (cleanInput(document.getElementById('pin3').value) === PIN3) screenPhase4();
  else wrongPin();
  return false;
}

function screenPhase4() {
  show(`
    <section class="card">
      <h1>${selectedPath.title}</h1>
      <h2>${selectedPath.phase4_title}</h2>
      <p class="story">${selectedPath.phase4_story}</p>
      ${locationImages('C')}
      <div class="exercise">Exercise: Push-ups x 30</div>
      <p class="note">Complete the exercise at Location C, then return to the starting point for PIN 4.</p>
      <form onsubmit="return checkPin4(event)">
        <input id="pin4" type="tel" inputmode="numeric" placeholder="PIN 4" autocomplete="off">
        <button type="submit">UNLOCK PHASE 5</button>
      </form>
    </section>
  `);
}

function checkPin4(event) {
  event.preventDefault();
  if (cleanInput(document.getElementById('pin4').value) === PIN4) screenPhase5();
  else wrongPin();
  return false;
}

function screenPhase5() {
  show(`
    <section class="card">
      <h1>${selectedPath.title}</h1>
      <h2>${selectedPath.phase5_title}</h2>
      <p class="story">${selectedPath.phase5_story}</p>
      <div class="exercise">Final Exercise: Run 1 final lap</div>
      <p class="note">Finish together. Return to the starting point for the final ending.</p>
      <button type="button" onclick="screenFinalEnding()">FINAL ENDING</button>
    </section>
  `);
}

function playEndingMusic() {
  const music = document.getElementById('endingMusic');
  if (!music || finalMusicStarted) return;
  finalMusicStarted = true;
  music.currentTime = 0;
  music.volume = 0.8;
  music.play().catch(function() {});
}

function screenFinalEnding() {
  playEndingMusic();
  show(`
    <section class="card final">
      <h1>Final Ending</h1>
      <p class="story">Different paths.

Different struggles.

Different journeys.

Some of you pushed through.

Some of you helped.

Some of you carried more.

Some of you started again.

Some of you found connection.

But every one of you…

kept moving.

Now one final moment.

Together.</p>
      <div class="photoBox">
        <h2>FINAL GROUP PHOTO</h2>
        <p class="story">Take one final group photo at the starting location.

Everyone must be visible.

No one gets left behind.

Post it in WhatsApp:

[Name of your path]</p>
      </div>
      <p class="story">You chose your path.

You lived it.

And you completed it.

We sweat.

We connect.</p>
    </section>
  `);
}

screenStart();
</script>
</body>
</html>
